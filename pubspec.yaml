name: zhiming
description: "织命 — 本地优先的跨平台 AI 长篇小说创作工作台"
publish_to: 'none'
version: 3.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.35.0
  sqlite3: ^3.5.2
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  file_picker: ^9.0.2
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  path: ^1.9.1
  wakelock_plus: ^1.2.10
  uuid: ^4.5.1
  intl: ^0.20.2
  fast_gbk: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/
    - assets/skill_packs/fictional-erotica/zh/
    - assets/skill_packs/fictional-erotica/en/
